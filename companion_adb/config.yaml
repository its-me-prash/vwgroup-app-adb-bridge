name: "VW Group App ADB Bridge"
version: "0.1.0-beta.9"
slug: "vag_connect_companion_adb"
stage: experimental
description: >-
  ADB-over-TLS bridge for the VW Group Connect companion channel. Bundles the
  real adb binary so it can pair with and drive an Android 11+ phone over
  wireless debugging (which the integration's pure-python transport cannot do),
  and exposes a small local API the integration talks to.
url: "https://github.com/its-me-prash/vwgroup-app-adb-bridge"
# adb (android-tools) is packaged for all the arches Home Assistant runs on.
# Base image is pinned in build.yaml.
arch:
  - amd64
  - aarch64
  - armv7
  - armhf
  - i386
startup: services
boot: manual
init: false
# host networking is REQUIRED: the bridge must reach the phone on the LAN and
# (later) discover the rotating wireless-debugging port via mDNS.
host_network: true
options:
  pair_code: ""
  pair_address: ""
  connect_address: ""
  api_token: ""
schema:
  # PAIRING (one time): on the phone open Wireless debugging → "Pair device with
  # pairing code" and enter the 6-digit code here. The add-on finds the pairing
  # IP:port over mDNS by itself, so the code is normally all you need.
  pair_code: "str?"
  # OPTIONAL pairing fallback: the pairing dialog's IP:port, only if mDNS does not
  # find it. This is the PAIRING port from the dialog, NOT the connect port on the
  # main Wireless debugging screen (pairing against the connect port fails).
  pair_address: "str?"
  # OPTIONAL connect fallback. The add-on finds the current connect IP:port over
  # mDNS (it is ephemeral and changes on every toggle/reboot), so leave this blank
  # unless mDNS discovery does not work on your network.
  connect_address: "str?"
  # Shared secret the integration must send in the X-Token header. Leave blank
  # only on a trusted, isolated network.
  api_token: "str?"
